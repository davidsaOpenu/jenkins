---
- name: Deploy student Jenkins VM
  hosts: all
  become: true
  vars_files:
    - vault.yml
  vars:
    jenkins_home: /var/lib/jenkins
    jenkins_http_port: 8080
    jenkins_admin_user: "{{ vault_jenkins_admin_user }}"
    jenkins_admin_password: "{{ vault_jenkins_admin_password }}"
    # No external caller ever references this VM's own URL (unlike central,
    # which needs a real reachable IP for Gerrit comment links) — localhost
    # is fine here, kept only so the CLI plugin-install origin check matches,
    # same mechanism central uses.
    jenkins_public_ip: localhost
    jenkins_plugins:
      - configuration-as-code
      - git
      - lockable-resources
      - workflow-aggregator
      - PrioritySorter

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart jenkins
      ansible.builtin.command: systemctl restart jenkins --no-block

    # daemon_reload only re-reads the unit *definition* — it never restarts
    # an already-running service. Without this, a changed secret/URL in a
    # re-rendered jenkins-agent.service silently keeps running with the old
    # values until someone manually restarts it (exactly what just happened).
    - name: Restart jenkins-agent
      ansible.builtin.systemd:
        name: jenkins-agent
        state: restarted

  tasks:
    # Same reasoning as central_deploy/roles/jenkins: IPv4-only guest, but
    # plenty of real hosts (pkg.jenkins.io, EPEL mirrors) are dual-stack, and
    # glibc's resolver tries IPv6 first by default.
    - name: Prefer IPv4 over IPv6 for outbound connections (guest has no IPv6 route)
      ansible.builtin.lineinfile:
        path: /etc/gai.conf
        line: "precedence ::ffff:0:0/96  100"
        create: true

    - name: Install Java 21
      ansible.builtin.dnf:
        name: java-21-openjdk
        state: present

    - name: Find Java 21 home
      ansible.builtin.shell: "ls -d /usr/lib/jvm/java-21-openjdk-* | head -1"
      register: java21_home
      changed_when: false

    - name: Set Java 21 as default
      community.general.alternatives:
        name: java
        path: "{{ java21_home.stdout }}/bin/java"

    - name: Add Jenkins repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins GPG key
      ansible.builtin.rpm_key:
        key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
        state: present

    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Create systemd drop-in directory for Jenkins
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Configure Jenkins environment via systemd drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_HOME={{ java21_home.stdout }}"
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
          Environment="CASC_JENKINS_CONFIG={{ jenkins_home }}/casc_configs"
          Environment="JENKINS_PORT={{ jenkins_http_port }}"
          TimeoutStartSec=300
        mode: "0644"
      notify: Restart jenkins

    - name: Create Jenkins secrets directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/secrets"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Write admin password to secrets file
      ansible.builtin.copy:
        content: "{{ jenkins_admin_password }}"
        dest: "{{ jenkins_home }}/secrets/admin-password"
        owner: jenkins
        group: jenkins
        mode: "0600"
      no_log: true
      notify: Restart jenkins

    - name: Create Jenkins init.groovy.d directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/init.groovy.d"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Deploy Jenkins URL init script
      ansible.builtin.copy:
        dest: "{{ jenkins_home }}/init.groovy.d/01-jenkins-url.groovy"
        owner: jenkins
        group: jenkins
        mode: "0644"
        content: |
          import jenkins.model.JenkinsLocationConfiguration

          def locationConfig = JenkinsLocationConfiguration.get()
          locationConfig.setUrl('http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}/')
          locationConfig.save()
      notify: Restart jenkins

    - name: Deploy admin password init script
      ansible.builtin.copy:
        dest: "{{ jenkins_home }}/init.groovy.d/00-admin-password.groovy"
        owner: jenkins
        group: jenkins
        mode: "0644"
        content: |
          import jenkins.model.Jenkins
          import hudson.security.HudsonPrivateSecurityRealm

          def password = new File('{{ jenkins_home }}/secrets/admin-password').text.trim()
          def realm = new HudsonPrivateSecurityRealm(false)
          realm.createAccount('{{ jenkins_admin_user }}', password)
          Jenkins.instance.setSecurityRealm(realm)
          Jenkins.instance.save()
      notify: Restart jenkins

    - name: Create JCasC directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/casc_configs"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Deploy JCasC configuration
      ansible.builtin.template:
        src: templates/jenkins_casc.yaml.j2
        dest: "{{ jenkins_home }}/casc_configs/jenkins.yaml"
        owner: jenkins
        group: jenkins
        mode: "0600"
      no_log: true
      notify: Restart jenkins

    - name: Create Jenkins .ssh directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/.ssh"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Deploy host SSH private key
      ansible.builtin.copy:
        content: "{{ vault_host_ssh_private_key }}"
        dest: "{{ jenkins_home }}/.ssh/host_id_ed25519"
        owner: jenkins
        group: jenkins
        mode: "0600"
      no_log: true

    - name: Render SSH config for build-host
      ansible.builtin.template:
        src: templates/ssh_config.j2
        dest: "{{ jenkins_home }}/.ssh/config"
        owner: jenkins
        group: jenkins
        mode: "0600"

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        daemon_reload: true
        enabled: true
        state: started

    - name: Flush handlers to apply new JCasC before plugin installation
      ansible.builtin.meta: flush_handlers

    - name: Wait for Jenkins to be ready with new JCasC
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/login"
        status_code: 200
      register: jenkins_up
      retries: 60
      delay: 10
      until: jenkins_up.status == 200

    - name: Check if each plugin is already installed
      ansible.builtin.stat:
        path: "{{ jenkins_home }}/plugins/{{ item }}.jpi"
      register: plugin_stats
      loop: "{{ jenkins_plugins }}"

    - name: Determine whether any plugin still needs installing
      ansible.builtin.set_fact:
        plugins_missing: "{{ plugin_stats.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 }}"

    - name: Download Jenkins CLI
      ansible.builtin.get_url:
        url: "http://localhost:{{ jenkins_http_port }}/jnlpJars/jenkins-cli.jar"
        dest: "{{ jenkins_home }}/jenkins-cli.jar"
        owner: jenkins
        group: jenkins
        mode: "0644"
      when: plugins_missing

    - name: Install Jenkins plugins
      ansible.builtin.command:
        cmd: >
          java -jar {{ jenkins_home }}/jenkins-cli.jar
          -s http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}
          -webSocket
          -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }}
          install-plugin {{ jenkins_plugins | join(' ') }} -restart
      become_user: jenkins
      changed_when: false
      no_log: true
      when: plugins_missing

    - name: Wait for Jenkins to restart after plugin installation
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/login"
        status_code: 200
      register: jenkins_up
      retries: 60
      delay: 10
      until: jenkins_up.status == 200
      when: plugins_missing

    # ── Everything below is student-only: registers this VM as a build
    #    agent on central Jenkins. Central has no equivalent — it IS the
    #    controller, it doesn't connect to one. ──────────────────────────────
    - name: Apply pending handlers before agent setup
      ansible.builtin.meta: flush_handlers

    - name: Create jenkins-agent directory
      ansible.builtin.file:
        path: /opt/jenkins-agent
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Download agent.jar from central Jenkins
      ansible.builtin.get_url:
        url: "{{ vault_central_url }}/jnlpJars/agent.jar"
        dest: /opt/jenkins-agent/agent.jar
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Create jenkins-agent work directory
      ansible.builtin.file:
        path: /var/lib/jenkins-agent
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Render jenkins-agent service
      ansible.builtin.template:
        src: templates/jenkins-agent.service.j2
        dest: /etc/systemd/system/jenkins-agent.service
        mode: "0644"
      notify:
        - reload systemd
        - Restart jenkins-agent

    # Without this, a fresh deploy starts the service once below (task) then
    # restarts it again at end-of-play (queued handler) — harmless but
    # wasteful. Flushing here lets the handler do the one real start/restart,
    # and the task below becomes a no-op confirmation instead of a duplicate.
    - name: Apply pending handlers before starting jenkins-agent
      ansible.builtin.meta: flush_handlers

    - name: Enable and start jenkins-agent service
      ansible.builtin.systemd:
        name: jenkins-agent
        state: started
        enabled: true
        daemon_reload: true

    - name: Read host SSH public key
      ansible.builtin.command: ssh-keygen -y -f /var/lib/jenkins/.ssh/host_id_ed25519
      register: host_pubkey
      changed_when: false

    - name: Add VM public key to host authorized_keys
      ansible.posix.authorized_key:
        user: "{{ vault_host_username }}"
        state: present
        key: "{{ host_pubkey.stdout }}"
      delegate_to: localhost
      become: false
