---
jenkins_home: /var/lib/jenkins
jenkins_internal_port: 8080
# Jenkins LTS version. Empty = auto-detect. Fetched via get.jenkins.io
# (Azure), not pkg.jenkins.io — its Fastly CDN range is blackholed here.
jenkins_version: ""
# Jenkins' externally-reachable URL, and its parts: scheme is TLS or not,
# listen_port is nginx's port (443/80 unless the URL names one), host is
# nginx's server_name, prefix ("" or e.g. "/jenkins") is Jenkins' --prefix
# and nginx's location. jenkins_internal_port above stays localhost-only.
# deploy_central_jenkins.sh resolves all of these from gerrit_central.yml's
# jenkins_url; the defaults here are only for a manual run against the
# CI test VM.
jenkins_url: "https://192.168.100.170"
jenkins_scheme: https
jenkins_host: 192.168.100.170
jenkins_prefix: ""
jenkins_listen_port: 443
# true: attach Jenkins to the existing nginx server already listening on
# jenkins_listen_port (shared with other apps) instead of adding its own —
# see nginx_shared_server.py.
nginx_shared_server: false
# The jobs' main repos whose 1_install_prereqs.sh the deploy runs
# (tasks/repo_prereqs.yml): each {name, url, branch} to clone, or {name,
# path} for a checkout already on disk. deploy_central_jenkins.sh
# --with-repo-jobs fills it from jobs/*/Jenkinsfile; empty (CI) = none.
repo_prereqs: []
# Root-owned: the scripts in these clones run as root.
repo_prereqs_dir: /var/cache/central_deploy/repos
# Pins jenkins-plugin-manager, used to pre-install plugins before Jenkins'
# first boot (so JCasC's authorizationStrategy is active from boot one,
# instead of leaving a window where Jenkins runs unsecured).
jenkins_plugin_manager_version: "2.15.0"
jenkins_plugins:
  - configuration-as-code
  - job-dsl
  - matrix-auth
  - git
  - workflow-aggregator
  - ansible
  - gerrit-trigger
  - ssh-credentials
  - credentials-binding
  - plain-credentials
  - lockable-resources
  - PrioritySorter
  - timestamper
  - pipeline-stage-view

# Where the osw-ci shared library (vars/: the approval gate every job
# calls) comes from:
# - gerrithub (production): this repo's master on GerritHub — the same
#   place every job's Jenkinsfile is read from, so the two never drift and
#   a merged change to the gate applies with no redeploy.
# - checkout (CI's disposable test VM only): the deploying checkout's
#   vars/, so CI exercises the library under test. Jenkins' git plugin
#   refuses local repositories unless ALLOW_LOCAL_CHECKOUT is set, so this
#   also sets it — never use it on a real central.
osw_ci_lib_source: gerrithub
osw_ci_lib_gerrithub_remote: "https://review.gerrithub.io/davidsaOpenu/jenkins"
