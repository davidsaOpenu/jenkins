---
# Guest has no IPv6 route, but glibc's getaddrinfo() tries IPv6 first by
# default — hosts with both A/AAAA records fail instantly instead of
# falling through to IPv4. Reorder the resolver's preference, don't disable
# IPv6.
- name: Prefer IPv4 over IPv6 for outbound connections (guest has no IPv6 route)
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    line: "precedence ::ffff:0:0/96  100"
    create: true
  tags: always

# Belt-and-braces on the gai.conf fix above: dnf's librepo is its own
# curl-based client and isn't necessarily bound by glibc's sort order.
- name: Force dnf to resolve IPv4 only (belt-and-braces, guest has no IPv6 route)
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    line: "ip_resolve=4"
    insertafter: "^\\[main\\]"
  tags: always

- name: Install Java 21
  ansible.builtin.dnf:
    name: java-21-openjdk
    state: present
  tags: install

- name: Find Java 21 home
  # java-21-openjdk-headless's postinstall scriptlet already registers the
  # real path (versioned on CentOS/RHEL, unversioned on Fedora) via
  # `alternatives --install` — read that back instead of re-deriving it, then
  # strip /bin/java for JAVA_HOME/ExecStart below. pipefail so a grep miss
  # fails loudly instead of silently producing an empty path.
  ansible.builtin.shell: "set -o pipefail; alternatives --display java | grep -E '^/.*java-21-openjdk.*/bin/java - ' | awk '{print $1}' | sed 's#/bin/java$##'"
  args:
    executable: /bin/bash
  register: java21_home
  changed_when: false
  failed_when: java21_home.rc != 0 or java21_home.stdout == ""
  tags: install

- name: Set Java 21 as default
  # link: required so this doesn't fail on a host where the postinstall
  # scriptlet's alternative somehow wasn't registered — harmless no-op
  # otherwise.
  community.general.alternatives:
    name: java
    path: "{{ java21_home.stdout }}/bin/java"
    link: /usr/bin/java
  tags: install

- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  register: install_epel
  until: install_epel is succeeded
  retries: 3
  delay: 10
  when: ansible_distribution != "Fedora"
  tags: install

- name: Install Ansible
  ansible.builtin.dnf:
    name: ansible
    state: present
  register: install_ansible_pkg
  until: install_ansible_pkg is succeeded
  retries: 3
  delay: 10
  tags: install

# Restores the "always latest LTS" behaviour the yum repo gave us, without
# touching Fastly: updates.jenkins.io (Azure-hosted, reachable) publishes
# the current LTS version as a one-line text file.
- name: Detect latest Jenkins LTS version (skipped if jenkins_version is pinned)
  ansible.builtin.command:
    cmd: curl -4 -sSfL --connect-timeout 15 https://updates.jenkins.io/stable/latestCore.txt
  register: latest_core
  until: latest_core is succeeded
  retries: 3
  delay: 10
  changed_when: false
  when: not jenkins_version
  tags: install

- name: Resolve Jenkins version to install
  ansible.builtin.set_fact:
    jenkins_version: "{{ jenkins_version if jenkins_version else latest_core.stdout | trim }}"
  tags: install

- name: Create jenkins group
  ansible.builtin.group:
    name: jenkins
    system: true
  tags: install

- name: Create jenkins user
  ansible.builtin.user:
    name: jenkins
    group: jenkins
    system: true
    home: "{{ jenkins_home }}"
    create_home: false
    shell: /sbin/nologin
  tags: install

# Only relevant when this host also runs run.sh (spawn_vm needs jenkins's
# service account in the libvirt group for qemu:///system access). No-op on
# a central-only production Jenkins with no libvirt group.
- name: Check for a local libvirt group
  ansible.builtin.command: getent group libvirt
  register: libvirt_group_check
  changed_when: false
  failed_when: false
  tags: install

- name: Add jenkins user to the libvirt group
  ansible.builtin.user:
    name: jenkins
    groups: libvirt
    append: true
  when: libvirt_group_check.rc == 0
  tags: install

- name: Create Jenkins home directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"
  tags: install

# get.jenkins.io (Azure-hosted, not the blackholed Fastly range) redirects to
# a mirror carrying the WAR + its checksum; get_url verifies sha256 inline.
- name: Fetch Jenkins WAR
  ansible.builtin.get_url:
    url: "https://get.jenkins.io/war-stable/{{ jenkins_version }}/jenkins.war"
    dest: "{{ jenkins_home }}/jenkins.war"
    checksum: "sha256:https://get.jenkins.io/war-stable/{{ jenkins_version }}/jenkins.war.sha256"
    owner: jenkins
    group: jenkins
    mode: "0644"
  register: fetch_jenkins_war
  until: fetch_jenkins_war is succeeded
  retries: 3
  delay: 10
  notify: Restart jenkins
  tags: install

- name: Create systemd unit for Jenkins
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service
    content: |
      [Unit]
      Description=Jenkins Automation Server
      After=network.target

      [Service]
      User=jenkins
      Group=jenkins
      WorkingDirectory={{ jenkins_home }}
      Environment="JAVA_HOME={{ java21_home.stdout }}"
      # Without this, Jenkins falls back to $HOME/.jenkins — NOT jenkins_home
      # — so none of the secrets/init.groovy.d/casc_configs written elsewhere
      # in this role to jenkins_home would ever be found at runtime.
      Environment="JENKINS_HOME={{ jenkins_home }}"
      Environment="CASC_JENKINS_CONFIG={{ jenkins_home }}/casc_configs"
      # -D flags are literal ExecStart words, not a $JAVA_OPTS variable — systemd
      # substitutes Environment= values into ExecStart as a single argv token,
      # with no shell-style word-splitting, so multi-flag strings like this one
      # would otherwise be glued into one broken argument.
      # preferIPv4Stack: plugin installs later in this play fetch from
      # Jenkins' own update center (updates.jenkins.io — Azure-hosted, not
      # the blackholed Fastly range) from *inside* this JVM — curl -4/dnf's
      # ip_resolve=4 don't cover that path at all. Same guarantee, same
      # reasoning, applied to the one network stack those two don't reach.
      ExecStart={{ java21_home.stdout }}/bin/java -Djava.awt.headless=true -Djenkins.install.runSetupWizard=false -Djava.net.preferIPv4Stack=true -jar {{ jenkins_home }}/jenkins.war --httpPort={{ jenkins_http_port }}
      Restart=on-failure
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins secrets directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/secrets"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0700"
  tags: configure

- name: Write admin password to secrets file
  ansible.builtin.copy:
    content: "{{ jenkins_admin_password }}"
    dest: "{{ jenkins_home }}/secrets/admin-password"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins init.groovy.d directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/init.groovy.d"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"
  tags: configure

- name: Deploy Jenkins URL init script
  ansible.builtin.copy:
    dest: "{{ jenkins_home }}/init.groovy.d/01-jenkins-url.groovy"
    owner: jenkins
    group: jenkins
    mode: "0644"
    content: |
      import jenkins.model.JenkinsLocationConfiguration

      def locationConfig = JenkinsLocationConfiguration.get()
      locationConfig.setUrl('http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}/')
      locationConfig.save()
  notify: Restart jenkins
  tags: configure

- name: Deploy admin password init script
  ansible.builtin.copy:
    dest: "{{ jenkins_home }}/init.groovy.d/00-admin-password.groovy"
    owner: jenkins
    group: jenkins
    mode: "0644"
    content: |
      import jenkins.model.Jenkins
      import hudson.security.HudsonPrivateSecurityRealm

      def password = new File('{{ jenkins_home }}/secrets/admin-password').text.trim()
      def realm = new HudsonPrivateSecurityRealm(false)
      realm.createAccount('{{ jenkins_admin_user }}', password)
      Jenkins.instance.setSecurityRealm(realm)
      Jenkins.instance.save()
  notify: Restart jenkins
  tags: configure

- name: Create JCasC directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/casc_configs"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"
  tags: configure

# The dummy job reads its Jenkinsfile from dummy_job_repo_url's master
# (cpsScm), no fallback — fail loudly here, before JCasC is applied, rather
# than silently deploying a job that never exercises real label routing.
- name: Check whether the dummy job Jenkinsfile exists on the repo's master
  ansible.builtin.shell: |
    set -e
    tmp=$(mktemp -d)
    trap 'rm -rf "$tmp"' EXIT
    GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 --no-checkout "{{ dummy_job_repo_url }}" "$tmp/repo"
    git -C "$tmp/repo" cat-file -e HEAD:jobs/swiftacular-dummy/Jenkinsfile
  delegate_to: localhost
  become: false
  register: dummy_jenkinsfile_check
  changed_when: false
  failed_when: false
  tags: configure

- name: Fail if the dummy job Jenkinsfile is missing
  ansible.builtin.fail:
    msg: >-
      jobs/swiftacular-dummy/Jenkinsfile not found on {{ dummy_job_repo_url }}
      master — the dummy job's real dynamic-label routing can't be deployed
      without it. Push/merge that file, or point dummy_job_repo_url at a
      repo/branch that already has it.
  when: dummy_jenkinsfile_check.rc != 0
  tags: configure

- name: Deploy JCasC configuration
  ansible.builtin.template:
    src: jenkins.yaml.j2
    dest: "{{ jenkins_home }}/casc_configs/jenkins.yaml"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins .ssh directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/.ssh"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0700"
  tags: configure

- name: Deploy Gerrit SSH private key
  ansible.builtin.copy:
    content: "{{ gerrit_ssh_private_key }}"
    dest: "{{ jenkins_home }}/.ssh/gerrit_id_ed25519"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  tags: configure

- name: Enable and start Jenkins
  ansible.builtin.systemd:
    name: jenkins
    daemon_reload: true
    enabled: true
    state: started
  tags: configure

- name: Remove stale job config so JCasC recreates it from current template
  ansible.builtin.file:
    path: "{{ jenkins_home }}/jobs/swiftacular-dummy/config.xml"
    state: absent
  # JCasC's jobs: block only (re-)runs at Jenkins boot/reload, not just
  # because this file changed — always restart so it's guaranteed to be
  # recreated fresh on every deploy, even if jenkins.yaml itself didn't change
  # (e.g. after someone manually deletes the job between runs).
  changed_when: true
  notify: Restart jenkins
  tags: configure

- name: Flush handlers to apply new JCasC before plugin installation
  ansible.builtin.meta: flush_handlers

- name: Wait for Jenkins to be ready with new JCasC
  block:
    - ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/login"
        status_code: 200
      register: jenkins_up
      retries: 60
      delay: 10
      until: jenkins_up.status == 200
  rescue:
    # Jenkins never came up in time — surface *why* right here instead of
    # just failing blind. The VM this ran on is disposable and gets torn
    # down as soon as the build ends, so this is the only chance to see
    # the actual crash/startup error.
    - name: Dump jenkins service status (Jenkins failed to come up)
      ansible.builtin.command: systemctl status jenkins --no-pager -l
      register: jenkins_status_dump
      changed_when: false
      failed_when: false
    - name: Dump jenkins service log (Jenkins failed to come up)
      ansible.builtin.command: journalctl -u jenkins --no-pager -n 200
      register: jenkins_journal_dump
      changed_when: false
      failed_when: false
    - ansible.builtin.debug:
        msg: "{{ jenkins_status_dump.stdout_lines + ['---'] + jenkins_journal_dump.stdout_lines }}"
    - ansible.builtin.fail:
        msg: "Jenkins never came up on :{{ jenkins_http_port }} — see service status/log dumped above."
  tags: configure

- name: Check if each plugin is already installed
  ansible.builtin.stat:
    path: "{{ jenkins_home }}/plugins/{{ item }}.jpi"
  register: plugin_stats
  loop: "{{ jenkins_plugins }}"
  tags: install

# Check every plugin, not just one as a stand-in — this role re-runs
# against the same long-lived VM, so a later addition to jenkins_plugins
# must still get installed.
- name: Determine whether any plugin still needs installing
  ansible.builtin.set_fact:
    plugins_missing: "{{ plugin_stats.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 }}"
  tags: install

- name: Download Jenkins CLI
  ansible.builtin.get_url:
    url: "http://localhost:{{ jenkins_http_port }}/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_home }}/jenkins-cli.jar"
    owner: jenkins
    group: jenkins
    mode: "0644"
  when: plugins_missing
  tags: install

- name: Install Jenkins plugins
  # -s must match jenkins_public_ip, not localhost — the CLI-over-WebSocket
  # origin check 403s on a mismatch. Plain HTTP checks elsewhere in this
  # file aren't affected, localhost is fine there.
  ansible.builtin.command:
    cmd: >
      java -jar {{ jenkins_home }}/jenkins-cli.jar
      -s http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}
      -webSocket
      -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }}
      install-plugin {{ jenkins_plugins | join(' ') }} -restart
  become_user: jenkins
  changed_when: false
  no_log: true
  when: plugins_missing
  tags: install

- name: Wait for Jenkins to restart after plugin installation
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_up
  retries: 60
  delay: 10
  until: jenkins_up.status == 200
  when: plugins_missing
  tags: install
