---
- name: Load vault credentials
  ansible.builtin.include_vars: vault.yml
  when: vault_in_use | default(true)
  tags: always

# This VM's networking is IPv4-only (libvirt NAT + a static private_network),
# but plenty of real hosts (pkg.jenkins.io included) publish both A and AAAA
# records. glibc's getaddrinfo() sorts IPv6 first by default, so anything
# that tries addresses in that order gets an instant "Network is unreachable"
# on the IPv6 attempt instead of falling through to the IPv4 one that would
# have worked. Standard fix, not a workaround: tell the resolver to prefer
# IPv4 (doesn't disable IPv6, just fixes the sort order).
- name: Prefer IPv4 over IPv6 for outbound connections (guest has no IPv6 route)
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    line: "precedence ::ffff:0:0/96  100"
    create: true
  tags: always

# Belt-and-braces on top of the gai.conf fix above: that only reorders
# candidates for whatever respects glibc's getaddrinfo() sort weighting.
# dnf's own fetches go through librepo (its own curl-based client, not
# necessarily bound by the same sort order), so force it at the tool level
# too — no ambiguity left about which family gets tried.
- name: Force dnf to resolve IPv4 only (belt-and-braces, guest has no IPv6 route)
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    line: "ip_resolve=4"
    insertafter: "^\\[main\\]"
  tags: always

- name: Install Java 21
  ansible.builtin.dnf:
    name: java-21-openjdk
    state: present
  tags: install

- name: Find Java 21 home
  ansible.builtin.shell: "ls -d /usr/lib/jvm/java-21-openjdk-* | head -1"
  register: java21_home
  changed_when: false
  tags: install

- name: Set Java 21 as default
  community.general.alternatives:
    name: java
    path: "{{ java21_home.stdout }}/bin/java"
  tags: install

# Forcing IPv4 (curl -4) still timed out on every one of Fastly's real
# IPv4 addresses — not an address-family problem, something is dropping
# traffic to this specific destination. The one open question: is that
# block guest-VM-only, or does it affect the physical host too? This runs
# the identical probe delegated to the host itself (not nested in a VM,
# confirmed earlier — no relay needed) so both results land in the same log.
- name: Diagnose Fastly reachability from the physical host (not just the guest)
  ansible.builtin.shell: |
    curl -4 -v --connect-timeout 5 https://pkg.jenkins.io/redhat-stable/jenkins.repo -o /dev/null 2>&1 | tail -40
  delegate_to: localhost
  become: false
  register: host_fastly_check
  changed_when: false
  ignore_errors: true
  tags: install

- name: Show host-side Fastly reachability result
  ansible.builtin.debug:
    var: host_fastly_check.stdout_lines
  tags: install

# Java 21 just installed fine via dnf (BaseOS/AppStream mirrors — a
# completely different network than Fastly, see task above), but
# pkg.jenkins.io has repeatedly failed here even with IPv4 forced. Capture
# the guest-side evidence too (DNS order, routing table) into this same
# console log, so the next run carries proof instead of a guess.
- name: Diagnose network path to pkg.jenkins.io
  ansible.builtin.shell: |
    echo "--- /etc/gai.conf ---"
    cat /etc/gai.conf
    echo "--- /etc/dnf/dnf.conf ---"
    cat /etc/dnf/dnf.conf
    echo "--- DNS: pkg.jenkins.io (the one that failed before this fix) ---"
    getent ahosts pkg.jenkins.io || true
    echo "--- DNS: a mirror host that just worked for Java 21 ---"
    MIRROR_HOST=$(grep -hoP '(?<=://)[^/]+' /etc/yum.repos.d/centos*.repo 2>/dev/null | head -1)
    echo "mirror host: ${MIRROR_HOST:-<none found>}"
    [ -n "$MIRROR_HOST" ] && getent ahosts "$MIRROR_HOST" || true
    echo "--- routing table ---"
    ip route
    ip -6 route || true
    echo "--- curl -4 to pkg.jenkins.io (this is what the next task actually uses) ---"
    curl -4 -v --connect-timeout 10 https://pkg.jenkins.io/redhat-stable/jenkins.repo -o /dev/null 2>&1 | tail -40
  changed_when: false
  ignore_errors: true
  register: network_diagnostics
  tags: install

# The shell task above reports as a plain "ok" (changed_when: false), and
# Ansible's default callback doesn't print stdout for "ok" results — so
# without this, the diagnostics above run but are invisible in the console
# log (confirmed: exactly what happened on the previous run). Force it.
- name: Show network diagnostics
  ansible.builtin.debug:
    var: network_diagnostics.stdout_lines
  tags: install

# The physical host has an https_proxy configured (see diagnostic above) —
# meaning direct outbound access to some destinations is evidently not how
# this network is meant to work — but its scheme is wrong (https:// instead
# of http://, hence the "wrong version number" error) and it's not ours to
# fix (not our server). What IS ours to control: whether the guest tries
# that same proxy, with the scheme corrected, as a fallback. Self-detecting
# — try direct first (proven to work for Java/EPEL above), only use the
# proxy if direct genuinely can't reach pkg.jenkins.io.
- name: Test direct connectivity to pkg.jenkins.io
  ansible.builtin.command:
    cmd: curl -4 -sSf --connect-timeout 8 https://pkg.jenkins.io/redhat-stable/jenkins.repo -o /dev/null
  register: direct_test
  changed_when: false
  ignore_errors: true
  tags: install

- name: Test pkg.jenkins.io via corrected proxy scheme (fallback, only if direct failed)
  ansible.builtin.command:
    cmd: curl -4 -sSf --connect-timeout 8 --proxy http://192.114.0.89:80 https://pkg.jenkins.io/redhat-stable/jenkins.repo -o /dev/null
  register: proxy_test
  changed_when: false
  ignore_errors: true
  when: direct_test is failed
  tags: install

- name: Determine how to reach pkg.jenkins.io
  ansible.builtin.set_fact:
    jenkins_fetch_proxy: "{{ 'http://192.114.0.89:80' if (direct_test is failed and proxy_test is not skipped and proxy_test is succeeded) else '' }}"
  tags: install

- name: Report which path reaches pkg.jenkins.io
  ansible.builtin.debug:
    msg: >-
      {{ 'direct connection works' if direct_test is succeeded
         else ('using proxy http://192.114.0.89:80 (direct failed)' if jenkins_fetch_proxy
         else 'NEITHER direct nor the corrected proxy could reach pkg.jenkins.io') }}
  tags: install

# get_url (Python's own HTTP client, not dnf/librepo) is what actually failed
# here — twice, even with gai.conf's sort-order fix confirmed applied. Rather
# than trust another layer of "should respect IPv4 preference," force it
# directly: curl -4 can't attempt IPv6 even if it wanted to.
- name: Add Jenkins repository
  ansible.builtin.command:
    cmd: >-
      curl -4 -sSfL --connect-timeout 15
      {{ '--proxy ' + jenkins_fetch_proxy if jenkins_fetch_proxy else '' }}
      -o /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/redhat-stable/jenkins.repo
    creates: /etc/yum.repos.d/jenkins.repo
  register: add_jenkins_repo
  until: add_jenkins_repo is succeeded
  retries: 3
  delay: 10
  tags: install

# dnf's later fetch of the actual jenkins RPM (via "Install Ansible and
# Jenkins" below) reads this same repo file — give it the proxy too, but
# only for this one repo, since BaseOS/AppStream/EPEL already work direct.
- name: Configure proxy for the Jenkins repo specifically (only if needed)
  ansible.builtin.lineinfile:
    path: /etc/yum.repos.d/jenkins.repo
    line: "proxy={{ jenkins_fetch_proxy }}"
    insertafter: "^\\[jenkins\\]"
  when: jenkins_fetch_proxy
  tags: install

- name: Download Jenkins GPG key (force IPv4, same reasoning as above)
  ansible.builtin.command:
    cmd: >-
      curl -4 -sSfL --connect-timeout 15
      {{ '--proxy ' + jenkins_fetch_proxy if jenkins_fetch_proxy else '' }}
      -o /tmp/jenkins.io-2023.key https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
  register: download_jenkins_key
  until: download_jenkins_key is succeeded
  retries: 3
  delay: 10
  changed_when: true
  tags: install

- name: Import Jenkins GPG key
  ansible.builtin.rpm_key:
    key: /tmp/jenkins.io-2023.key
    state: present
  tags: install

- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  register: install_epel
  until: install_epel is succeeded
  retries: 3
  delay: 10
  tags: install

- name: Install Ansible and Jenkins
  ansible.builtin.dnf:
    name:
      - ansible
      - jenkins
    state: present
  register: install_jenkins_pkg
  until: install_jenkins_pkg is succeeded
  retries: 3
  delay: 10
  tags: install

- name: Create systemd drop-in directory for Jenkins
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: "0755"
  tags: configure

- name: Configure Jenkins environment via systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    content: |
      [Service]
      Environment="JAVA_HOME={{ java21_home.stdout }}"
      # preferIPv4Stack: plugin installs later in this play fetch from
      # Jenkins' own update center (updates.jenkins.io) from *inside* this
      # JVM — curl -4/dnf's ip_resolve=4 don't cover that path at all. Same
      # guarantee, same reasoning, applied to the one network stack those
      # two don't reach. Proxy flags only added if the direct-vs-proxy test
      # above found direct access doesn't work — same fallback as the repo/key fetch.
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false -Djava.net.preferIPv4Stack=true{{ ' -Dhttp.proxyHost=192.114.0.89 -Dhttp.proxyPort=80 -Dhttps.proxyHost=192.114.0.89 -Dhttps.proxyPort=80' if jenkins_fetch_proxy else '' }}"
      Environment="CASC_JENKINS_CONFIG={{ jenkins_home }}/casc_configs"
      Environment="JENKINS_PORT={{ jenkins_http_port }}"
      TimeoutStartSec=300
    mode: "0644"
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins secrets directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/secrets"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0700"
  tags: configure

- name: Write admin password to secrets file
  ansible.builtin.copy:
    content: "{{ jenkins_admin_password }}"
    dest: "{{ jenkins_home }}/secrets/admin-password"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins init.groovy.d directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/init.groovy.d"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"
  tags: configure

- name: Deploy Jenkins URL init script
  ansible.builtin.copy:
    dest: "{{ jenkins_home }}/init.groovy.d/01-jenkins-url.groovy"
    owner: jenkins
    group: jenkins
    mode: "0644"
    content: |
      import jenkins.model.JenkinsLocationConfiguration

      def locationConfig = JenkinsLocationConfiguration.get()
      locationConfig.setUrl('http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}/')
      locationConfig.save()
  notify: Restart jenkins
  tags: configure

- name: Deploy admin password init script
  ansible.builtin.copy:
    dest: "{{ jenkins_home }}/init.groovy.d/00-admin-password.groovy"
    owner: jenkins
    group: jenkins
    mode: "0644"
    content: |
      import jenkins.model.Jenkins
      import hudson.security.HudsonPrivateSecurityRealm

      def password = new File('{{ jenkins_home }}/secrets/admin-password').text.trim()
      def realm = new HudsonPrivateSecurityRealm(false)
      realm.createAccount('{{ jenkins_admin_user }}', password)
      Jenkins.instance.setSecurityRealm(realm)
      Jenkins.instance.save()
  notify: Restart jenkins
  tags: configure

- name: Create JCasC directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/casc_configs"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"
  tags: configure

- name: Deploy JCasC configuration
  ansible.builtin.template:
    src: jenkins.yaml.j2
    dest: "{{ jenkins_home }}/casc_configs/jenkins.yaml"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  notify: Restart jenkins
  tags: configure

- name: Create Jenkins .ssh directory
  ansible.builtin.file:
    path: "{{ jenkins_home }}/.ssh"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0700"
  tags: configure

- name: Deploy Gerrit SSH private key
  ansible.builtin.copy:
    content: "{{ gerrit_ssh_private_key }}"
    dest: "{{ jenkins_home }}/.ssh/gerrit_id_ed25519"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  tags: configure

# Only needed if this Jenkins runs inside a VM and run.sh must relay work
# to the physical host — see vault_host_username/vault_host_ssh_private_key.
- name: Deploy host SSH private key (for run.sh's VM-to-host relay)
  ansible.builtin.copy:
    content: "{{ host_ssh_private_key }}"
    dest: "{{ jenkins_home }}/.ssh/host_id_ed25519"
    owner: jenkins
    group: jenkins
    mode: "0600"
  no_log: true
  when: host_username | length > 0
  tags: configure

- name: Deploy build-host SSH config entry (for run.sh's VM-to-host relay)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ jenkins_home }}/.ssh/config"
    owner: jenkins
    group: jenkins
    mode: "0600"
  when: host_username | length > 0
  tags: configure

- name: Enable and start Jenkins
  ansible.builtin.systemd:
    name: jenkins
    daemon_reload: true
    enabled: true
    state: started
  tags: configure

- name: Remove stale job config so JCasC recreates it from current template
  ansible.builtin.file:
    path: "{{ jenkins_home }}/jobs/swiftacular-dummy/config.xml"
    state: absent
  # JCasC's jobs: block only (re-)runs at Jenkins boot/reload, not just
  # because this file changed — always restart so it's guaranteed to be
  # recreated fresh on every deploy, even if jenkins.yaml itself didn't change
  # (e.g. after someone manually deletes the job between runs).
  changed_when: true
  notify: Restart jenkins
  tags: configure

- name: Flush handlers to apply new JCasC before plugin installation
  ansible.builtin.meta: flush_handlers

- name: Wait for Jenkins to be ready with new JCasC
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_up
  retries: 60
  delay: 10
  until: jenkins_up.status == 200
  tags: configure

- name: Check if each plugin is already installed
  ansible.builtin.stat:
    path: "{{ jenkins_home }}/plugins/{{ item }}.jpi"
  register: plugin_stats
  loop: "{{ jenkins_plugins }}"
  tags: install

# Checking only configuration-as-code.jpi as a stand-in for "all plugins
# installed" meant a plugin added to jenkins_plugins later would silently
# never get installed on an already-provisioned VM (this role is designed
# to be re-run against the same long-lived VM, not just a fresh one).
- name: Determine whether any plugin still needs installing
  ansible.builtin.set_fact:
    plugins_missing: "{{ plugin_stats.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 }}"
  tags: install

- name: Download Jenkins CLI
  ansible.builtin.get_url:
    url: "http://localhost:{{ jenkins_http_port }}/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_home }}/jenkins-cli.jar"
    owner: jenkins
    group: jenkins
    mode: "0644"
  when: plugins_missing
  tags: install

- name: Install Jenkins plugins
  # Must match jenkins_public_ip (Jenkins' own configured root URL), not
  # localhost — the CLI-over-WebSocket handshake validates the connecting
  # origin against that URL and 403s ("Unexpected request origin") on a
  # mismatch. Plain HTTP checks elsewhere in this file don't have that
  # restriction, so localhost is still fine for those.
  ansible.builtin.command:
    cmd: >
      java -jar {{ jenkins_home }}/jenkins-cli.jar
      -s http://{{ jenkins_public_ip }}:{{ jenkins_http_port }}
      -webSocket
      -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }}
      install-plugin {{ jenkins_plugins | join(' ') }} -restart
  become_user: jenkins
  changed_when: false
  no_log: true
  when: plugins_missing
  tags: install

- name: Wait for Jenkins to restart after plugin installation
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_up
  retries: 60
  delay: 10
  until: jenkins_up.status == 200
  when: plugins_missing
  tags: install
